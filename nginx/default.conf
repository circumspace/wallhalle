# Replaces the image's stock server block. The Hugo output is baked into
# the image; the cuts and originals are not. They live on a volume the
# deployment mounts at /srv/wallhalle, filled by the fetch job in the
# infrastructure repo, and /dl/ is aliased onto it.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WIP gate, same non-secret credentials as the blog (wip / hacktheplanet,
    # htpasswd committed). Keeps crawlers out while there is no impressum
    # and the painting metadata is unverified. The kubelet probes
    # in the infrastructure repo send the header. Remove this block and
    # nginx/htpasswd to launch.
    auth_basic "work in progress";
    auth_basic_user_file /etc/nginx/htpasswd;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    location /w/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location /dl/ {
        alias /srv/wallhalle/dl/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=604800";
    }
}
