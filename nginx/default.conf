# Replaces the image's stock server block. The Hugo output is baked into
# the image; no painting file is. Thumbnails, previews, cuts and originals
# live on a volume the deployment mounts at /srv/wallhalle, filled by the
# tools Job (scripts/cluster-sync.sh), and /w/ and /dl/ are aliased onto it.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    # The stock mime.types has no otf entry; default_type covers it here.
    location /fonts/ {
        default_type font/otf;
        add_header Cache-Control "public, max-age=604800";
    }

    location /w/ {
        alias /srv/wallhalle/w/;
        add_header Cache-Control "public, max-age=604800";
    }

    location /dl/ {
        alias /srv/wallhalle/dl/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=604800";
    }
}
